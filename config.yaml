      - url: "https://www.youtube.com/@VOAHausa"
        domain: "news"
        priority: high
        country: "NG"
      - url: "https://www.youtube.com/@DWHausa"
        domain: "news"
        priority: high
        country: "NG"

  - name: "Yoruba"
    code: "yo"
    region: "West Africa"
    dialects: ["yo-NG", "yo-BJ", "yo-GH"]
    speakers_millions: 50
    sources:
      - url: "https://www.youtube.com/@BBCYoruba"
        domain: "news"
        priority: high
        country: "NG"
      - url: "https://www.youtube.com/@VOAYoruba"
        domain: "news"
        priority: high
        country: "NG"

  - name: "Igbo"
    code: "ig"
