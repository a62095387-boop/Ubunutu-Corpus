# ─── Adding a New Language ────────────────────────────────────────────────────
#
# Example (4 required fields + sources):
#
#   - name: "Zulu"
#     code: "zu"
#     region: "Southern Africa"
#     sources:
#       - url: "https://www.youtube.com/@SABCZulu"
#         domain: "news"
#         country: "ZA"
#
# Then run: python pipeline.py
# That's it. The pipeline handles everything else.
# ─────────────────────────────────────────────────────────────────────────────
