# ════════════════════════════════════════════════════════════════════════════
#  Ubuntu Corpus — Scheduled Pipeline Workflow
#
#  Runs every Monday, Wednesday, and Friday at 00:00 UTC.
#  Executes the full pipeline: harvest → transcribe → quality → export → publish.
#
#  Secrets required (set in GitHub repo Settings → Secrets → Actions):
#    HF_TOKEN        — HuggingFace API token (for dataset publishing)
# ════════════════════════════════════════════════════════════════════════════

name: Ubuntu Corpus — Weekly Pipeline

on:
  schedule:
    - cron: "0 0 * * 1"   # Monday    00:00 UTC
    - cron: "0 0 * * 3"   # Wednesday 00:00 UTC
    - cron: "0 0 * * 5"   # Friday    00:00 UTC

  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run Full Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          which ffmpeg
          which ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore harvest cache
        uses: actions/cache@v4
        with:
          path: data/audio
          key: audio-cache-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            audio-cache-${{ runner.os }}-

      - name: Run Ubuntu Corpus pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipeline.py \
            --model distil-whisper/distil-large-v3 \
            --use-mms \
            --hf-token "$HF_TOKEN" \
            --workers 2

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: pipeline.log
          retention-days: 30

      - name: Upload datasets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: datasets-${{ github.run_id }}
          path: data/datasets/
          retention-days: 7